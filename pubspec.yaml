name: quran
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^3.3.2
  riverpod_annotation: any
  go_router: ^17.4.0

  # Networking & REST Client
  dio: ^5.11.0
  dio_http_formatter: ^3.3.1
  retrofit: ^4.9.2

  # Audio Player & Background Notification Service
  just_audio: ^0.10.6
  audio_service: 0.18.18

  # Local Database & User Preferences Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.3
  sqflite_common_ffi_web: ^0.4.3+3
  archive: ^4.0.2
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  # Data Modeling & Utilities
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.3
  multiple_result: ^5.1.0
  scrollable_positioned_list: ^0.3.8
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  share_plus: ^10.1.4
  audio_session: ^0.2.4
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  image_picker: ^1.2.3
  zxing2: ^0.2.4
  image: ^4.9.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^18.0.1
  flutter_poolakey: ^2.2.0+1.0.0
  pinput:
    path: C:/Users/flutter/AppData/Local/Pub/Cache/hosted/pub.dev/pinput-5.0.2
  smart_auth:
    path: C:/Users/flutter/AppData/Local/Pub/Cache/hosted/pub.dev/smart_auth-3.2.0
  flutter_patcher: ^0.1.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generators
  build_runner: ^2.4.11
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.4
  retrofit_generator: ^10.2.8
  sqflite_common_ffi: ^2.4.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/reciters/
    - assets/database/
    - assets/icons/
    - assets/json/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/IRANSansWeb.ttf
          weight: 400
        - asset: assets/fonts/IRANSansWeb_Light.ttf
          weight: 300
        - asset: assets/fonts/IRANSansWeb_Medium.ttf
          weight: 500
        - asset: assets/fonts/IRANSansWeb_Bold.ttf
          weight: 700
    - family: IRANSans
      fonts:
        - asset: assets/fonts/IRANSansWeb.ttf
          weight: 400
        - asset: assets/fonts/IRANSansWeb_Light.ttf
          weight: 300
        - asset: assets/fonts/IRANSansWeb_Medium.ttf
          weight: 500
        - asset: assets/fonts/IRANSansWeb_Bold.ttf
          weight: 700
    - family: Uthmanic
      fonts:
        - asset: assets/fonts/uthmanic.ttf
    - family: Neyrizi
      fonts:
        - asset: assets/fonts/neyrizi.ttf
    - family: Thuluth
      fonts:
        - asset: assets/fonts/Thuluth.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/uthmanic.ttf
    - family: BNazanin
      fonts:
        - asset: assets/fonts/BNazanin.ttf
